name: Publish demo
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _site/demo
          cp demo/index.html _site/index.html
          cp demo/index.html _site/demo/index.html
          cp in-app-editor.js index.js README.md PROMPT.md _site/
          sed -i 's|src="../in-app-editor.js"|src="./in-app-editor.js"|g; s|href="../PROMPT.md"|href="./PROMPT.md"|g; s|href="../README.md"|href="./README.md"|g' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
