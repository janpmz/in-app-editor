<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>In-App Editor</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; color: #fafafa; background: #09090b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body { margin: 0; }
    header { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid #27272a; background: #111113; }
    .brand { display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 600; }
    .brand svg { padding: 4px; width: 24px; height: 24px; color: #18181b; background: #fafafa; border-radius: 6px; }
    nav { display: flex; gap: 8px; }
    a, button { display: inline-flex; align-items: center; justify-content: center; min-height: 34px; padding: 6px 12px; border: 1px solid #3f3f46; border-radius: 6px; color: #fafafa; background: transparent; text-decoration: none; font: 500 12px/20px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; cursor: pointer; }
    a:hover, button:hover { background: #27272a; }
    main { min-height: calc(100dvh - 64px); padding: 80px max(24px, calc((100vw - 1000px) / 2)); background-image: radial-gradient(#27272a .7px, transparent .7px); background-size: 24px 24px; }
    .page { width: min(100%, 760px); min-height: 430px; padding: 48px; background: #111113; border: 1px solid #27272a; border-radius: 8px; }
    h1 { margin: 0 0 16px; font-size: 40px; line-height: 1.2; font-weight: 600; letter-spacing: -1px; }
    p { margin: 0 0 28px; color: #a1a1aa; font-size: 15px; line-height: 24px; }
    .row { display: flex; gap: 10px; align-items: center; }
    .primary { color: #18181b; border-color: #fafafa; background: #fafafa; }
    .primary:hover { background: #d4d4d8; }
    .box { width: 180px; height: 100px; margin-top: 48px; border: 1px solid #3f3f46; border-radius: 6px; background: #18181b; display: grid; place-items: center; }
    .box svg { width: 32px; height: 32px; color: #a1a1aa; }
    @media(max-width:600px) { header { padding: 0 16px; } nav a { padding: 6px 8px; } main { padding: 40px 20px; } .page { padding: 28px; } h1 { font-size: 32px; } }
  </style>
</head>
<body>
  <header>
    <span class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m7 17 10-10M7 7h10v10"/></svg>In-App Editor</span>
    <nav><a href="../PROMPT.md">Prompt</a><a href="https://github.com/janpmz/in-app-editor">GitHub</a></nav>
  </header>
  <main>
    <section class="page" id="sample-page">
      <h1 id="page-title">Page title</h1>
      <p id="page-text">Page text.</p>
      <div class="row"><button class="primary" id="sample-button">Button</button><a href="#page-title" id="sample-link">Link</a></div>
      <div class="box" id="sample-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" aria-label="Square"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></div>
    </section>
  </main>
  <script src="../in-app-editor.js" defer></script>
</body>
</html>
